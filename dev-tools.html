<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Develop Tools | Joshua Boateng Nketiah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ==========================================================================
           GLOBAL & THEME STYLES
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 2rem 5%; 
        }
        
        /* Navigation */
        .top-nav { width: 100%; max-width: 1000px; display: flex; justify-content: flex-start; margin-bottom: 2rem; }
        .back-btn { color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 0.5rem; }
        .back-btn:hover { color: #38bdf8; transform: translateX(-5px); }

        /* Header */
        header { text-align: center; margin-bottom: 3rem; width: 100%; }
        header h1 { font-size: 2.5rem; color: #f8fafc; margin-bottom: 0.5rem; }
        header h1 i { color: #38bdf8; margin-right: 0.5rem; }
        header p { color: #94a3b8; font-size: 1.1rem; }

        /* ==========================================================================
           GRID & CARD LAYOUT
           ========================================================================== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }

        .tool-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        
        .tool-card h2 { font-size: 1.3rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .tool-card h2 i { color: #38bdf8; font-size: 1.5rem; }

        /* ==========================================================================
           FORM ELEMENTS (Inputs, Textareas, Buttons, Sliders)
           ========================================================================== */
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 600; }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            resize: vertical;
        }
        input[type="text"]:focus, textarea:focus { border-color: #38bdf8; }

        /* Action Buttons */
        .btn-row { display: flex; gap: 1rem; margin-top: auto; }
        button {
            flex: 1;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-secondary { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
        .btn-secondary:hover { background: rgba(56, 189, 248, 0.1); }

        /* Custom Range Slider */
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        
        /* Checkboxes */
        .checkbox-group { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
        .checkbox-item { display: flex; align-items: center; gap: 0.5rem; color: #cbd5e1; cursor: pointer; }
        .checkbox-item input { accent-color: #38bdf8; width: 1.2rem; height: 1.2rem; cursor: pointer; }

        /* ==========================================================================
           TOOL-SPECIFIC STYLES
           ========================================================================== */
        /* Text Analyzer Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .stat-box { background: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 8px; text-align: center; }
        .stat-box span { display: block; color: #94a3b8; font-size: 0.85rem; }
        .stat-box strong { color: #38bdf8; font-size: 1.5rem; }

        /* Color Swatch */
        .color-preview { width: 100%; height: 60px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; margin-bottom: 1rem; transition: background 0.3s; }

        /* ==========================================================================
           TOAST NOTIFICATION (For copying to clipboard)
           ========================================================================== */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #10b981; /* Success Green */
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        @media (max-width: 768px) {
            .tools-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <header>
        <h1><i class="fa-solid fa-code"></i> Developer Tools</h1>
        <p>A collection of fast, client-side utilities built with JavaScript.</p>
    </header>

    <div class="tools-grid">
        
        <div class="tool-card">
            <h2><i class="fa-solid fa-chart-bar"></i> Text Analyzer</h2>
            <div class="input-group">
                <textarea id="textInput" rows="4" placeholder="Type or paste your text here to analyze..."></textarea>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Words</span>
                    <strong id="wordCount">0</strong>
                </div>
                <div class="stat-box">
                    <span>Characters</span>
                    <strong id="charCount">0</strong>
                </div>
                <div class="stat-box">
                    <span>Sentences</span>
                    <strong id="sentCount">0</strong>
                </div>
                <div class="stat-box">
                    <span>Reading Time</span>
                    <strong><span id="readTime" style="color:#38bdf8;">0</span> <span style="font-size: 0.9rem; color:#94a3b8;">min</span></strong>
                </div>
            </div>
            <div class="btn-row" style="margin-top: 1.5rem;">
                <button class="btn-secondary" onclick="clearText()"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>
        </div>

        <div class="tool-card">
            <h2><i class="fa-solid fa-shield-halved"></i> Password Generator</h2>
            
            <div class="input-group">
                <input type="text" id="passResult" readonly placeholder="Click generate..." style="font-size: 1.2rem; text-align: center; letter-spacing: 2px;">
            </div>
            
            <label>Length: <span id="lengthVal" style="color: #38bdf8;">16</span> chars</label>
            <input type="range" id="passLength" min="8" max="32" value="16" oninput="updateLength(this.value)">

            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" id="incNum" checked> Numbers (0-9)</label>
                <label class="checkbox-item"><input type="checkbox" id="incSym" checked> Symbols (!@#$)</label>
            </div>

            <div class="btn-row">
                <button class="btn-primary" onclick="generatePassword()"><i class="fa-solid fa-bolt"></i> Generate</button>
                <button class="btn-secondary" onclick="copyToClipboard('passResult')"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>

        <div class="tool-card">
            <h2><i class="fa-solid fa-palette"></i> Color Converter</h2>
            
            <div class="color-preview" id="colorPreview"></div>
            
            <div class="input-group">
                <label>HEX Code</label>
                <input type="text" id="hexInput" placeholder="#38bdf8" onkeyup="convertColor()">
            </div>
            
            <div class="input-group">
                <label>RGB Value</label>
                <input type="text" id="rgbOutput" readonly placeholder="rgb(56, 189, 248)">
            </div>

            <div class="btn-row">
                <button class="btn-secondary" onclick="copyToClipboard('rgbOutput')"><i class="fa-regular fa-copy"></i> Copy RGB</button>
            </div>
        </div>

        <div class="tool-card">
            <h2><i class="fa-solid fa-file-code"></i> Base64 Encoder</h2>
            
            <div class="input-group">
                <label>Input String</label>
                <textarea id="baseInput" rows="2" placeholder="Enter text to encode or decode..."></textarea>
            </div>
            
            <div class="input-group">
                <label>Output Result</label>
                <textarea id="baseOutput" rows="2" readonly placeholder="Result will appear here..."></textarea>
            </div>

            <div class="btn-row">
                <button class="btn-primary" onclick="encodeBase64()"><i class="fa-solid fa-lock"></i> Encode</button>
                <button class="btn-primary" style="background: #64748b; color: #fff;" onclick="decodeBase64()"><i class="fa-solid fa-lock-open"></i> Decode</button>
                <button class="btn-secondary" onclick="copyToClipboard('baseOutput')"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>

    </div>

    <div id="toast"><i class="fa-solid fa-check-circle"></i> Copied to clipboard!</div>

    <script>
        // ==========================================================================
        // TOAST NOTIFICATION SYSTEM (Clipboard API)
        // ==========================================================================
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${message}`;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            if (!copyText.value) return; // Don't copy empty strings
            
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(copyText.value);
            
            showToast("Copied to clipboard!");
        }

        // ==========================================================================
        // TOOL 1: TEXT ANALYZER LOGIC
        // ==========================================================================
        document.getElementById('textInput').addEventListener('input', function() {
            let text = this.value;
            
            // Character count
            document.getElementById('charCount').textContent = text.length;
            
            // Word count (splits by spaces/newlines and filters empties)
            let words = text.trim().split(/\s+/).filter(word => word.length > 0);
            let wordCount = words.length;
            document.getElementById('wordCount').textContent = wordCount;
            
            // Sentence count (splits by ., !, or ?)
            let sentences = text.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0);
            document.getElementById('sentCount').textContent = text.length === 0 ? 0 : sentences.length;

            // Estimated reading time (average adult reads 238 words per minute)
            let readTime = Math.ceil(wordCount / 238);
            document.getElementById('readTime').textContent = wordCount === 0 ? 0 : readTime;
        });

        function clearText() {
            document.getElementById('textInput').value = '';
            // Manually trigger the input event to reset the counters
            document.getElementById('textInput').dispatchEvent(new Event('input'));
        }

        // ==========================================================================
        // TOOL 2: PASSWORD GENERATOR LOGIC
        // ==========================================================================
        function updateLength(val) {
            document.getElementById('lengthVal').textContent = val;
        }

        function generatePassword() {
            const length = document.getElementById('passLength').value;
            const incNum = document.getElementById('incNum').checked;
            const incSym = document.getElementById('incSym').checked;
            
            let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (incNum) chars += "0123456789";
            if (incSym) chars += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            let password = "";
            // Ensure cryptographically stronger random numbers if available
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);
            
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }
            
            document.getElementById('passResult').value = password;
        }

        // Generate one on page load automatically
        window.addEventListener('DOMContentLoaded', generatePassword);

        // ==========================================================================
        // TOOL 3: COLOR CONVERTER LOGIC
        // ==========================================================================
        function convertColor() {
            let hex = document.getElementById('hexInput').value.trim();
            const output = document.getElementById('rgbOutput');
            const preview = document.getElementById('colorPreview');

            // Add # if user forgot it
            if (hex.length > 0 && hex[0] !== '#') hex = '#' + hex;

            // Validates 3-digit or 6-digit hex
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                let c = hex.substring(1).split('');
                if(c.length === 3){
                    c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                const r = (c >> 16) & 255;
                const g = (c >> 8) & 255;
                const b = c & 255;
                
                const rgbStr = `rgb(${r}, ${g}, ${b})`;
                output.value = rgbStr;
                preview.style.backgroundColor = rgbStr;
            } else {
                output.value = "";
                preview.style.backgroundColor = "#0f172a"; // Reset to default background
            }
        }

        // ==========================================================================
        // TOOL 4: BASE64 ENCODER/DECODER LOGIC
        // ==========================================================================
        function encodeBase64() {
            const input = document.getElementById('baseInput').value;
            if(!input) return;
            try {
                // btoa encodes to base64
                document.getElementById('baseOutput').value = btoa(input);
            } catch (e) {
                document.getElementById('baseOutput').value = "Error: Invalid string for encoding.";
            }
        }

        function decodeBase64() {
            const input = document.getElementById('baseInput').value;
            if(!input) return;
            try {
                // atob decodes from base64
                document.getElementById('baseOutput').value = atob(input);
            } catch (e) {
                document.getElementById('baseOutput').value = "Error: Invalid Base64 string.";
            }
        }
    </script>
</body>
</html>
